{% extends "global/Page.html" %}
{% load otree static %}

{{ block content }}

<style>

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

#_otree-title:empty {
  display: none !important;
}

.otree-timer {
  display: none;
}

.otree-body.container {
  max-width: 100% !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
}

*, *::before, *::after {
  box-sizing: border-box;
}

#instructionContainer {
	position: absolute;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	background: rgba(0, 0, 0, 0.95);   
	z-index: 999;
/*	display: none; */
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
}

#playerID {
	display: flex;
	justify-content: center;
	align-items: center;
	height:70vh;
	width: auto;
	aspect-ratio: 1/1;
	font-size: 70vh;
	font-weight: bolder;
	text-align: center;
	color: rgba(255, 255, 255, 0.95);
}

#instructionBox {
	text-align: center;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	height: 30vh;
	width: 100vh;
	background: rgba(255, 255, 255, 0.95);
	border: 2px solid #333;
	border-radius: 1vh;
	padding: 2vh;
	font-size: 3.5vh;
	box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
}

#instructionText {
	text-align: center;
}

.instruction-buttons {
	margin-top: 5vh;
	display: flex;
	gap: 2vh;
	justify-content: center;
}

.instruction-buttons button {
	font-size: 3vh;
	margin-left: 1vh;
	padding: 0.5vh 2vh;
	cursor: pointer;
}

.hidden {
	display: none;
}

.highlight {
	z-index: 1000 !important;
}

</style>

<div id="instructionContainer">
	<div id="playerID"></div>
	<div id="instructionBox">
		<div id="instructionText"></div>
		<div class="instruction-buttons">
			<button id="prevBtn" type="button" onclick="prevStep()">Anterior</button>
			<button id="nextBtn" type="button" onclick="nextStep()">Siguiente</button>
		</div>
	</div>
</div>
</div>

<form id="advanceForm" method="post" class="hidden">
	<button type="submit" class="hidden" id="submitBtn"></button>
</form>

<script>

let prevBtn, nextBtn, instructions;

const currentPlayer = js_vars.currentPlayer;
const previousPlayer = js_vars.previousPlayer;
const noPrevious = js_vars.noPrevious;
const firstF2F = js_vars.firstF2F;
const room = js_vars.nextRoom;
const terminal = js_vars.nextTerminal;

let currentInstruction = 0;

if (noPrevious && firstF2F) {

  instructions = [
	  {
		  text: `Fin del bloque 2 🤩, sal de la sala para recibir las instrucciones del último bloque.`,
		  highlight: []
	  },
	  {
		  text: `Si eres el <strong>jugador ${currentPlayer}</strong>, presiona 'Comenzar'.`,
		  highlight: []
	  }
  ];

} else if (noPrevious) {
  instructions = [
	  {
		  text: `Si eres el <strong>jugador ${currentPlayer}</strong>, presiona 'Comenzar'.`,
		  highlight: []
	  }
  ];
} else {
  instructions = [
	  {
		  text: `<strong>Jugador ${previousPlayer}</strong>: debes ir a la <strong>sala ${room}</strong> y sentarte en el <strong>computador ${terminal}</strong>.`,
		  highlight: []
	  },
	  {
		  text: `Si eres el <strong>jugador ${currentPlayer}</strong>, presiona 'Comenzar'.`,
		  highlight: []
	  }
  ];
}

function showInstruction(index) {
	const container = document.getElementById('instructionContainer');
	const box = document.getElementById('instructionBox');
	const text = document.getElementById('instructionText');
	if (index < 0 || index >= instructions.length) return;

	if (noPrevious && !firstF2F) {
	  document.getElementById('nextBtn').textContent = 'Comenzar';
	}

	// Remove old highlights
	document.querySelectorAll('.highlight').forEach(el => {
		el.classList.remove('highlight');
	});

	// Apply new highlights
	const instruction = instructions[index];
	instruction.highlight.forEach(selector => {
		document.querySelectorAll(selector).forEach(el => {
			el.classList.add('highlight');
		});
	});

	text.innerHTML = instruction.text;
			
	// Hide or show previous button
	if (index === 0) {
		prevBtn.classList.add('hidden');
	} else {
		prevBtn.classList.remove('hidden');
	}

	if (index === instructions.length - 1 && !advanceGranted) {
		//console.log("No permission yet, advance button locked");
		nextBtn.classList.add('hidden');
	}
}

function nextStep() {
	if (currentInstruction < instructions.length - 1) {
		currentInstruction++;
		if (currentInstruction === instructions.length - 1) {
			nextBtn.textContent = 'Comenzar';
		}
		showInstruction(currentInstruction);
	} else if (currentInstruction === instructions.length - 1){
		if (advanceGranted) {
			document.getElementById('submitBtn').click();
		}
	}
}

function prevStep() {
	if (currentInstruction > 0) {
		currentInstruction--;
		nextBtn.textContent = 'Siguiente';
		nextBtn.classList.remove('hidden');
		showInstruction(currentInstruction);
	}
}

let advanceGranted = false;

let pingInterval = null;

function startPinging() {
	//console.log("📡 startPinging triggered");
	if (pingInterval === null) {
		pingInterval = setInterval(() => {
			//console.log("📤 Sending ping");
			liveSend({ action: "ping" });
		}, 2000);
	}
}

function stopPinging() {
	if (pingInterval !== null) {
		clearInterval(pingInterval);
		pingInterval = null;
	}
}

function liveRecv(data) {

	//console.log("🔄 Live message received:", data);
			
	if (data.advance === true) {
		advanceGranted = true;
			nextBtn.classList.remove('hidden');
		//console.log("Advance granted, button unlocked");
		stopPinging();
	} else {
		//console.log("Advance denied, button locked");
	}
}

document.addEventListener("DOMContentLoaded", () => {

  const playerID = document.getElementById('playerID');
  playerID.textContent = currentPlayer;
  
  prevBtn = document.getElementById('prevBtn');
  nextBtn = document.getElementById('nextBtn');

  showInstruction(currentInstruction);

  startPinging();
});

</script>


{{ endblock }}
