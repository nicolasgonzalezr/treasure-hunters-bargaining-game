{% extends "global/Page.html" %}
{% load otree static %}

{{ block content }}

<style>

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

#_otree-title:empty {
  display: none !important;
}

.otree-timer {
  display: none;
}

.otree-body.container {
  max-width: 100% !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
}

*, *::before, *::after {
  box-sizing: border-box;
}

#resultsContainer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);   
  z-index: 999;  
}

#resultsBox {
  position: relative;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 40vh;
  width: 100vh;
  background: rgba(255, 255, 255, 0.95);
  border: 2px solid #333;
  border-radius: 1vh;
  padding: 2vh;
  font-size: 3.5vh;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
}

#resultsText {
  text-align: center;
}

.results-buttons {
  margin-top: 5vh;
  display: flex;
  gap: 2vh;
  justify-content: center;
}

.results-buttons button {
  font-size: 3vh;
  margin-left: 1vh;
  padding: 0.5vh 2vh;
  cursor: pointer;
}

</style>

<div id="resultsContainer">
  <div id="resultsBox">
    <div id="resultsText"></div>
    <div class="results-buttons">
      <button id="nextBtn" type="button" onclick="nextStep()">Finalizar</button>
    </div>
  </div>
</div>

<form id="advanceForm" method="post" style="display: none;" >
  <button type="submit" style="display: none;" id="submitBtn"></button>
</form>

<script>

const agreement = js_vars.agreement_reached;
const payoff = js_vars.payoff;
const opponentPayoff = js_vars.opponentPayoff;

const message = agreement
  ? `Han llegado a un acuerdo, tu pago en esta ronda es: <strong>${payoff}</strong>, el otro jugador obtuvo ${opponentPayoff}.`
  : `No han llegado a un acuerdo, tu pago en esta ronda es: <strong>${payoff}</strong>, el otro jugador obtuvo ${opponentPayoff}.`;

document.getElementById("resultsText").innerHTML = message;

function nextStep() {
  document.getElementById('submitBtn').click();
}

</script>


{{ endblock }}
