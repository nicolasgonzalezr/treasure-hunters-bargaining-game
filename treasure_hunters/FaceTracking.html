{% extends "global/Page.html" %}
{% load static %}
{% block content %}

<style>

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

#_otree-title:empty {
  display: none !important;
}

.otree-timer {
  display: none;
}

.otree-body.container {
  max-width: 100% !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
}

*, *::before, *::after {
  box-sizing: border-box;
}

#instructionContainer {
	position: absolute;
	top: 0;
	left: 50%;
	transform: translateX(-50%);
	width: 100vw;
	height: 100vh;
	background: rgba(0, 0, 0, 0.95);   
	z-index: 999;
/*	display: none; */
}

#instructionContainer.highlight{
	background: transparent;
}

#instructionBox {
	position: relative;
	left: 50%;
	transform: translate(-50%, -50%);
	text-align: center;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	height: 40vh;
	width: 100vh;
	background: rgba(255, 255, 255, 0.95);
	border: 2px solid #333;
	border-radius: 1vh;
	padding: 2vh;
	font-size: 3.5vh;
	box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
}

#instructionText {
	text-align: center;
}

.instruction-buttons {
	margin-top: 5vh;
	display: flex;
	gap: 2vh;
	justify-content: center;
}

.instruction-buttons button {
	font-size: 3vh;
	margin-left: 1vh;
	padding: 0.5vh 2vh;
	cursor: pointer;
}

.hidden {
	display: none;
}

.highlight {
	z-index: 1000 !important;
}

#video {
  width: 0;
  height: 0;
  opacity: 0;
  position: absolute;
  z-index: -1;
}

#avatarWrapper {
  position: relative;
  height: 62.5vh;
  aspect-ratio: 1/1;
  width: auto;
  left: 50%;
  transform: translateX(-50%);
  overflow: hidden;
  top: 0%;
}

#avatarContainer {
  position: relative;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  height: 110%;
  aspect-ratio: 1/1;
  width: auto;
  filter: drop-shadow(0 7px 28px rgba(0,0,0,0.3));
}

</style>

<div id="avatarWrapper">
	<div id="avatarContainer"></div>
</div>

<div id="instructionContainer">
	<div id="instructionBox">
		<div id="instructionText"></div>
		<div class="instruction-buttons">
			<button id="prevBtn" type="button" onclick="prevStep()">Anterior</button>
			<button id="nextBtn" type="button" onclick="nextStep()">Siguiente</button>
		</div>
	</div>
</div>

<video id="video" autoplay muted playsinline aria-hidden="true"></video>

<form id="advanceForm" method="post" style="display: none;" >
	<button type="submit" style="display: none;" id="submitBtn"></button>
</form>

<script>
const avatarPath = "/static/global/avatars/glb/" + js_vars.avatarName;

let prevBtn, nextBtn;
let currentInstruction = 0;

const instructions = [
	  {
		  text: "Este es tu avatar.",
		  top: "75vh",
		  highlight: ["#avatarWrapper"]
	  },
	  {
		  text: "Pruébalo ahora, pon alguna cara 😀📸.",
		  top: "75vh",
		  highlight: ["#avatarWrapper"]
	  },
	  {
		  text: "Esto es lo que verá la persona con la que vas a jugar durante la negociación.",
		  top: "75vh",
		  highlight: ["#avatarWrapper"]
	  },
	  {
		  text: "Si tienes alguna duda, levanta la mano <strong>ahora</strong> para recibir asistencia de nuestro equipo 🙋.",
		  highlight: [],
		  background: [],
		  top: "50vh"
	  },
	  {
		  text: "Si has comprendido, presiona 'Finalizar' para ir al juego.",
		  highlight: [],
		  background: [],
		  top: "50vh"
	  }
];

function showInstruction(index) {
	const container = document.getElementById('instructionContainer');
	const box = document.getElementById('instructionBox');
	const text = document.getElementById('instructionText');
	if (index < 0 || index >= instructions.length) return;

	// Remove old highlights
	document.querySelectorAll('.highlight').forEach(el => {
		el.classList.remove('highlight');
	});

	// Apply new highlights
	const instruction = instructions[index];
	instruction.highlight.forEach(selector => {
		document.querySelectorAll(selector).forEach(el => {
			el.classList.add('highlight');
		});
	});

	box.style.top = instruction.top || "50vh";
	text.innerHTML = instruction.text;
//	container.classList.remove('hidden'); #USED FOR INITIAL DELAY, REMOVE
			
	// Hide or show previous button
	if (index === 0) {
		prevBtn.classList.add('hidden');
	} else {
		prevBtn.classList.remove('hidden');
	}
}

function nextStep() {
	if (currentInstruction < instructions.length - 1) {
		currentInstruction++;
		if (currentInstruction === instructions.length - 1) {
			nextBtn.textContent = 'Finalizar';
		}
		showInstruction(currentInstruction);
	} else if (currentInstruction === instructions.length - 1){
		document.getElementById('submitBtn').click();
	}
}

function prevStep() {
	if (currentInstruction > 0) {
		currentInstruction--;
		nextBtn.textContent = 'Siguiente';
		showInstruction(currentInstruction);
	}
}

document.addEventListener("DOMContentLoaded", () => {

  prevBtn = document.getElementById('prevBtn');
  nextBtn = document.getElementById('nextBtn');

  showInstruction(currentInstruction);
});

</script>

<script src="/static/AvatarAnimation/assets/FaceTracking.js"></script>

{% endblock %}
